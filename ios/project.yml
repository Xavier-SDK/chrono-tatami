name: ChronoTatami
options:
  bundleIdPrefix: com.xaviersdk
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  ChronoTatamiCore:
    path: ChronoTatamiCore
targets:
  ChronoTatami:
    type: application
    platform: iOS
    sources:
      - path: Telephone
      - path: Partage
    dependencies:
      - package: ChronoTatamiCore
      - target: ChronoTatamiMontre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xaviersdk.chronotatami
        PRODUCT_NAME: Chrono Tatami
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Telephone/Info.plist
      properties:
        CFBundleDisplayName: Chrono Tatami
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIAppFonts: [BigShouldersDisplay-Black.ttf, Barlow-600.ttf, Barlow-700.ttf]
        UIBackgroundModes: [audio]
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Fiche de cours
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
            LSHandlerRank: Alternate
  ChronoTatamiMontre:
    type: application
    platform: watchOS
    sources:
      - path: Montre
      - path: Partage
    dependencies:
      - package: ChronoTatamiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xaviersdk.chronotatami.watchkitapp
        PRODUCT_NAME: Chrono Tatami
    info:
      path: Montre/Info.plist
      properties:
        CFBundleDisplayName: Chrono Tatami
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        UIAppFonts: [BigShouldersDisplay-Black.ttf, Barlow-600.ttf, Barlow-700.ttf]
        WKCompanionAppBundleIdentifier: com.xaviersdk.chronotatami
        WKRunsIndependentlyOfCompanionApp: false
schemes:
  ChronoTatami:
    build:
      targets:
        ChronoTatami: all
        ChronoTatamiMontre: all
    run:
      config: Debug
  ChronoTatamiMontre:
    build:
      targets:
        ChronoTatamiMontre: all
    run:
      config: Debug
